# Release pipeline: deploy the API to Azure App Service, then build the Android APK and the
# Windows app against that API and publish both as a GitHub release.
#
# Runs on every push to main, or by hand from the Actions tab. There is no tagging step: the
# version is 1.0.<run number> and the release job creates that tag for you, so main is always
# deployed and every build keeps a permanent download link.
#
# Each half of the repository triggers only its own work, per .github/path-filters.yml:
# an API change deploys the API, a MAUI change builds the Android and Windows apps and
# publishes a release, and a change to both does both. Documentation never triggers anything.
#
# Android and Windows are deliberately not split from each other. They build from the same
# project, so a release carrying a fresh APK beside a stale Windows build would be worse than
# one that took four extra minutes.
#
# The Windows download is a Velopack installer, and the update packages beside it are the feed
# the installed app polls at startup. MAUI has no ClickOnce, so this is what makes the desktop
# build self-updating.
#
# One-time setup: scripts/azure-bootstrap.ps1 creates the Azure resources and stores the
# secrets and variables this file reads. See README.md.
#
#   Variables  AZURE_WEBAPP_NAME, API_BASE_URL
#   Secrets    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC login)
#              or AZURE_WEBAPP_PUBLISH_PROFILE                            (fallback)
#              ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,        (optional; without them
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD                     the APK is debug-signed)
#
# The iOS build is not here: Xcode Cloud builds it from XcodeCloud/ on Apple's Macs.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version, e.g. 1.2.3. Default: 1.0.<run number>.'
        required: false
        type: string

permissions:
  contents: write   # create the release
  id-token: write   # Azure OIDC login

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MOBILE_PROJECT: MacMaui.Mobile/MacMaui.Mobile.csproj

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.v.outputs.display }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            display="$INPUT_VERSION"
          else
            display="1.0.$GITHUB_RUN_NUMBER"
          fi
          {
            echo "display=$display"
            echo "build=$GITHUB_RUN_NUMBER"      # CFBundleVersion / versionCode: unique per run
            echo "tag=v$display"
          } >> "$GITHUB_OUTPUT"
          echo "Version $display (build $GITHUB_RUN_NUMBER)"

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      maui: ${{ steps.filter.outputs.maui }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/path-filters.yml

      - name: Check the filters still cover the project references
        # Without this, adding a project and forgetting the filter would silently stop
        # triggering builds. The guard turns that into a failure instead.
        run: python3 scripts/check-path-filters.py

      - name: Summary
        run: |
          echo "api=${{ steps.filter.outputs.api }}  maui=${{ steps.filter.outputs.maui }}"

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.maui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # MacMaui.Tests is not here on purpose: it starts the real AppHost, which wants Docker and
      # an interactive dev tunnel login. These two are plain net10.0 and run in seconds, which is
      # what makes them worth gating a deploy on.
      - name: API unit tests
        run: dotnet test MacMaui.ApiTests/MacMaui.ApiTests.csproj --configuration Release

      - name: Client unit and BDD tests
        run: dotnet test MacMaui.ClientTests/MacMaui.ClientTests.csproj --configuration Release

  deploy-api:
    name: Deploy API to Azure
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # The OIDC federated credential created by scripts/azure-bootstrap.ps1 trusts
    # repo:<owner>/<repo>:environment:production, so the job must run in that environment.
    environment:
      name: production
      url: ${{ vars.API_BASE_URL }}
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish MacMaui.ApiService/MacMaui.ApiService.csproj --configuration Release --output "${{ runner.temp }}/api"

      - name: Azure login (OIDC)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (OIDC)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE == ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/api

      - name: Deploy (publish profile)
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api

      - name: Smoke test
        # Free-tier App Service cold starts slowly; give it a couple of minutes.
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors \
            "${{ vars.API_BASE_URL }}/weatherforecast"
          echo
          echo "API is answering at ${{ vars.API_BASE_URL }}"

  android:
    name: Android APK
    needs: [version, changes, test, deploy-api]
    # Runs on any MAUI change. always() is needed because deploy-api is skipped when
    # only app code changed, and a skipped dependency would otherwise skip this too.
    if: |
      always() && needs.changes.outputs.maui == 'true'
      && needs.version.result == 'success' && needs.test.result == 'success'
      && needs.deploy-api.result != 'failure' && needs.deploy-api.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK components the build needs
        run: |
          dotnet build "$MOBILE_PROJECT" -t:InstallAndroidDependencies \
            --framework net10.0-android \
            -p:SingleTargetFramework=net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AcceptAndroidSDKLicenses=True

      - name: Publish APK
        run: |
          signing=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            signing=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
            )
            echo "Signing with the release keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK gets the default debug signature."
          fi

          dotnet publish "$MOBILE_PROJECT" \
            --framework net10.0-android \
            --configuration Release \
            -p:SingleTargetFramework=net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidPackageFormats=apk \
            -p:ApiBaseUrl="$API_BASE_URL" \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            -p:ApplicationVersion="$BUILD_NUMBER" \
            "${signing[@]}" \
            --output "$RUNNER_TEMP/android"

          mkdir -p dist
          cp "$RUNNER_TEMP"/android/*-Signed.apk "dist/MacMaui.Mobile-$DISPLAY_VERSION-android.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows app
    needs: [version, changes, test, deploy-api]
    # Runs on any MAUI change. always() is needed because deploy-api is skipped when
    # only app code changed, and a skipped dependency would otherwise skip this too.
    if: |
      always() && needs.changes.outputs.maui == 'true'
      && needs.version.result == 'success' && needs.test.result == 'success'
      && needs.deploy-api.result != 'failure' && needs.deploy-api.result != 'cancelled'
    runs-on: windows-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      # No setup-dotnet here on purpose. The windows-latest image ships a .NET 10 SDK with the
      # maui-windows workload preinstalled by Visual Studio; a separately installed SDK cannot
      # see those packs and spends 4 to 5 minutes downloading them again.
      - name: Use the image's preinstalled MAUI workload
        shell: pwsh
        run: |
          dotnet --version
          $workloads = dotnet workload list
          $workloads
          if (-not ($workloads | Select-String -SimpleMatch 'maui-windows')) {
            Write-Host 'maui-windows is not preinstalled on this image; installing.'
            dotnet workload install maui-windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish unpackaged Windows app
        shell: pwsh
        run: |
          # Unpackaged, and framework-dependent on .NET: the Velopack installer below declares
          # net10-x64-desktop and fetches that runtime if the machine lacks it, which halves the
          # download (53 MB rather than 97 MB) and the update packages with it.
          #
          # WindowsAppSDKSelfContained stays true on purpose. Velopack can install the .NET
          # runtime but has no installer for the Windows App SDK, which MAUI also needs, so that
          # one still travels with the app.
          #
          # RuntimeIdentifierOverride is how the MAUI SDK takes the RID without pushing it onto
          # the referenced class libraries.
          dotnet publish "$env:MOBILE_PROJECT" `
            --framework net10.0-windows10.0.19041.0 `
            --configuration Release `
            -p:SingleTargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=false `
            -p:ApiBaseUrl="$env:API_BASE_URL" `
            -p:ApplicationDisplayVersion="$env:DISPLAY_VERSION" `
            -p:ApplicationVersion="$env:BUILD_NUMBER" `
            --output "$env:RUNNER_TEMP/windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Velopack turns the published folder into an installer plus the update feed the app
      # reads at startup. MAUI has no ClickOnce equivalent, so without this the desktop build
      # can only ever be replaced by hand.
      - name: Install Velopack
        shell: pwsh
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Fetch the previous release
        shell: pwsh
        # Lets Velopack diff against the last version and emit a small delta package, so
        # returning users download a fraction of the full app. There is nothing to fetch for
        # the first release, and a missing feed must not fail the build.
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/feed" | Out-Null
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --outputDir "$env:RUNNER_TEMP/feed"

      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId MacMaui `
            --packVersion "$env:DISPLAY_VERSION" `
            --packDir "$env:RUNNER_TEMP/windows" `
            --mainExe MacMaui.Mobile.exe `
            --packTitle "MacMaui" `
            --packAuthors "Snow College" `
            --framework net10.0-x64-desktop `
            --outputDir "$env:RUNNER_TEMP/feed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Ship the installer, the update package and the feed index. The portable zip is
          # left behind deliberately: it duplicates the installer at roughly 95 MB a release,
          # and the installed build is the one that can update itself.
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:RUNNER_TEMP/feed/*Setup.exe" "dist/MacMaui-$env:DISPLAY_VERSION-windows-Setup.exe"
          Copy-Item "$env:RUNNER_TEMP/feed/*.nupkg" dist/
          foreach ($index in 'RELEASES', 'releases.win.json', 'assets.win.json') {
            $path = Join-Path $env:RUNNER_TEMP "feed/$index"
            if (Test-Path $path) { Copy-Item $path dist/ }
          }
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[int]($_.Length/1MB)}}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, changes, android, windows]
    # Only publish when there are fresh artifacts to publish.
    if: |
      always() && needs.changes.outputs.maui == 'true'
      && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The tag does not exist yet: this action creates it at the commit being built, which is
      # what removes the manual `git tag` step.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MacMaui ${{ needs.version.outputs.display }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
          body: |
            Built from `${{ github.sha }}` on ${{ github.ref_name }}.
            Every client in this release talks to the API at ${{ vars.API_BASE_URL }}.

            | Download | Install |
            |---|---|
            | `MacMaui.Mobile-${{ needs.version.outputs.display }}-android.apk` | Copy to an Android device and open it (allow installs from this source). |
            | `MacMaui-${{ needs.version.outputs.display }}-windows-Setup.exe` | Run it. The app updates itself from this page after that. |
            | iOS | TestFlight, built by Xcode Cloud from the same commit. |
